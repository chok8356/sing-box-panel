name: Checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call: # reused by release.yml
permissions:
  contents: read
env:
  SING_BOX: /tmp/sing-box-1.14.4-linux-amd64/sing-box
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: shellcheck install.sh
      - name: Download sing-box for integration tests
        run: curl -fsSL https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-linux-amd64.tar.gz | tar -xz -C /tmp
      - name: Real sing-box integration
        run: SING_BOX_TEST_BINARY=$SING_BOX go test -race ./...
      - name: Installer integration (disposable root container)
        run: >-
          docker run --rm --init -v "$PWD:/src" -w /src -v "$SING_BOX:/sing-box:ro"
          -e SBP_INSTALL_TEST=1 -e SING_BOX_TEST_BINARY=/sing-box
          golang:1.26 go test -run TestInstallLifecycle -v ./internal/installer
